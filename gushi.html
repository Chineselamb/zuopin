<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的故事 · 张欣阳</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: #05070c;
            color: #eef1f7;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        .frame {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px;
        }

        .stage {
            position: relative;
            width: min(100%, calc((100vh - 150px) * 16 / 9));
            aspect-ratio: 16 / 9;
            background: #0a0d14;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
        }

        svg { display: block; width: 100%; height: 100%; }

        .scene { opacity: 0; transition: opacity .6s ease; }
        .scene.on { opacity: 1; }

        /* 字幕胶囊 */
        .cap {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: #fff;
            color: #1a1a1a;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: clamp(12px, 1.7vw, 20px);
            font-weight: 600;
            letter-spacing: .02em;
            max-width: 84%;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity .5s ease, transform .5s ease;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
        }

        .cap.on { opacity: 1; transform: translateX(-50%) translateY(0); }

        .sub {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 4.5%;
            text-align: center;
            font-size: clamp(10px, 1.35vw, 15px);
            color: rgba(255, 255, 255, .82);
            letter-spacing: .04em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .9);
        }

        /* 控制条 */
        .bar {
            width: min(100%, calc((100vh - 150px) * 16 / 9));
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar button {
            border: 1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .04);
            color: #eef1f7;
            font: 500 12px/1 -apple-system, "Microsoft YaHei", sans-serif;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }

        .bar button:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .28); }

        .track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, .1);
            border-radius: 99px;
            overflow: hidden;
            cursor: pointer;
        }

        .fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #9fc4ff, #c9aaff);
            border-radius: 99px;
        }

        .num {
            font: 500 11px/1 "SFMono-Regular", Consolas, monospace;
            letter-spacing: .12em;
            color: rgba(255, 255, 255, .4);
            white-space: nowrap;
        }

        .back {
            position: fixed;
            top: 14px;
            left: 16px;
            font: 500 11px/1 "SFMono-Regular", Consolas, monospace;
            letter-spacing: .16em;
            color: rgba(255, 255, 255, .55);
            text-decoration: none;
            z-index: 5;
        }

        .back:hover { color: #fff; }

        /* 场景里的小动画 */
        .breathe { animation: breathe 3.6s ease-in-out infinite; transform-origin: center bottom; }
        @keyframes breathe { 50% { transform: translateY(-2px); } }

        .flicker { animation: flicker 4s ease-in-out infinite; }
        @keyframes flicker { 0%, 100% { opacity: .95; } 45% { opacity: .55; } 70% { opacity: .85; } }

        .glowPulse { animation: glowPulse 3s ease-in-out infinite; }
        @keyframes glowPulse { 50% { opacity: .45; } }

        .wheel { animation: spin 1.6s linear infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .floaty { animation: floaty 5s ease-in-out infinite; }
        @keyframes floaty { 50% { transform: translateY(-10px); } }

        .rise { animation: rise 1.2s cubic-bezier(.2, .8, .2, 1) both; }
        @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
        @keyframes rise { from { opacity: 0; transform: translateY(26px); } }

        @media (max-width: 560px) {
            .frame { padding: 10px; gap: 10px; }
            .bar { flex-wrap: wrap; }
            .num { display: none; }
        }
    </style>
</head>

                    <defs>
                        <linearGradient id="doorG" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="#8fbcff" stop-opacity=".55" />
                            <stop offset="100%" stop-color="#8fbcff" stop-opacity="0" />
                        </linearGradient>
                    </defs>

                    <!-- 身后手的影子（推） -->
                    <path d="M420,560 q60,-40 120,-10 q40,22 30,60 q-6,30 -44,34 q-60,6 -106,-24 z" fill="#10151f" opacity=".9" class="floaty" />

                    <!-- 我，背影，迈向门 -->
                    <g class="breathe" transform="translate(760,740)">
                        <circle cx="0" cy="-180" r="28" fill="#05070c" />
                        <path d="M-28,-150 h56 a20,20 0 0 1 20,20 v96 h-96 v-96 a20,20 0 0 1 20,-20 z" fill="#05070c" />
                        <rect x="-24" y="-34" width="18" height="94" rx="9" fill="#05070c" />
                        <rect x="6" y="-34" width="18" height="94" rx="9" fill="#05070c" />
                    </g>

                    <!-- 地面 -->
                    <rect y="826" width="1600" height="74" fill="#04060b" />
                </g>

            </svg>

            <div class="cap" id="cap">高二之前的每个周末，我都在街上骑车。</div>
            <div class="sub" id="sub">不知道能去哪，也不知道能做好什么</div>
        </div>

        <div class="bar">
            <button id="play">暂停</button>
            <button id="replay">重播</button>
            <button id="prev">上一镜</button>
            <button id="next">下一镜</button>
            <div class="track" id="track"><div class="fill" id="fill"></div></div>
            <span class="num" id="num">1 / 8</span>
        </div>
    </div>

    <script>
        // 每一镜：主字幕 / 底部小字 / 时长（秒）
        const SHOTS = [
            { cap: "高二之前的每个周末，我都在街上骑车。", sub: "不知道能去哪，也不知道能做好什么", dur: 12 },
            { cap: "同学把我拉进了竞赛班。", sub: "我对计算机一窍不通，连打字都不会", dur: 12 },
            { cap: "只有 HTML，让我第一次觉得：这东西我能看懂。", sub: "那天晚上我坐到很晚", dur: 12 },
            { cap: "第一个比赛，我以为能拿奖。", sub: "没有", dur: 11 },
            { cap: "身边人说：你这人干啥都马虎。", sub: "我也开始这么觉得", dur: 12 },
            { cap: "接下来两个更难：Python、Java、Vue、MySQL。", sub: "我每天学到深夜", dur: 13 },
            { cap: "人工智能、应用软件开发，都拿了奖。", sub: "我做到了", dur: 11 },
            { cap: "我一直是被别人推着走的那个人。", sub: "这一次，我想自己推自己一把", dur: 13 }
        ]

        const scenes = [].slice.call(document.querySelectorAll(".scene"))
        const cap = document.getElementById("cap")
        const sub = document.getElementById("sub")
        const fill = document.getElementById("fill")
        const num = document.getElementById("num")
        const track = document.getElementById("track")
        const playBtn = document.getElementById("play")

        let now = 0
        let t0 = 0
        let playing = true
        let raf = null

        function show(i, resetClock) {
            now = i
            scenes.forEach(function (s, k) { s.classList.toggle("on", k === i) })
            cap.classList.remove("on")
            sub.classList.remove("on")
            setTimeout(function () {
                cap.textContent = SHOTS[i].cap
                sub.textContent = SHOTS[i].sub
                cap.classList.add("on")
                sub.classList.add("on")
            }, 120)
            num.textContent = (i + 1) + " / " + SHOTS.length
            if (resetClock) t0 = performance.now()
            update()
        }

        function update() {
            const p = Math.min(1, (performance.now() - t0) / (SHOTS[now].dur * 1000))
            fill.style.width = (p * 100) + "%"
        }

        function loop() {
            if (!playing) return
            update()
            if (performance.now() - t0 >= SHOTS[now].dur * 1000) {
                if (now < SHOTS.length - 1) show(now + 1, true)
                else { playing = false; playBtn.textContent = "重播"; return }
            }
            raf = requestAnimationFrame(loop)
        }

        function play() {
            if (!playing) {
                playing = true
                if (now === SHOTS.length - 1 && fill.style.width === "100%") show(0, true)
                else t0 = performance.now()
                playBtn.textContent = "暂停"
                loop()
            }
        }

        function pause() {
            playing = false
            cancelAnimationFrame(raf)
            playBtn.textContent = "播放"
        }

        playBtn.addEventListener("click", function () {
            if (playing) pause()
            else play()
        })

        document.getElementById("replay").addEventListener("click", function () {
            show(0, true)
            playing = true
            playBtn.textContent = "暂停"
            loop()
        })

        document.getElementById("prev").addEventListener("click", function () {
            show(Math.max(0, now - 1), true)
        })

        document.getElementById("next").addEventListener("click", function () {
            show(Math.min(SHOTS.length - 1, now + 1), true)
        })

        track.addEventListener("click", function (e) {
            const r = track.getBoundingClientRect()
            const p = (e.clientX - r.left) / r.width
            show(Math.min(SHOTS.length - 1, Math.floor(p * SHOTS.length)), true)
        })

        addEventListener("keydown", function (e) {
            if (e.key === " ") { e.preventDefault(); playing ? pause() : play() }
            if (e.key === "ArrowRight") show(Math.min(SHOTS.length - 1, now + 1), true)
            if (e.key === "ArrowLeft") show(Math.max(0, now - 1), true)
        })

        // 支持 ?s=3 直接跳到第 4 镜（方便预览和截图）
        const qs = new URLSearchParams(location.search).get("s")
        const start = qs ? Math.max(0, Math.min(SHOTS.length - 1, Number(qs))) : 0
        show(start, true)
        loop()
    </script>
</body>

</html>
