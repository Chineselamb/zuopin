<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="购物车.css">

<body>
    <div class="gowuboxx">
        <div class="top">
            <div class="wodegowuche">我的购物车</div>
            <div class="qingkong">清空购物车</div>

        <div class="gowuchebox">
            <div class="gowuchetop">

                    <input type="checkbox" checked class="goxuan">

                </div>
            </div>
            <div class="shangpinbox">
                <div class="shangpin bordershang">
                    <div class="zuo">
                        <input type="checkbox" checked class="goxuan">
                        <div class="jieshaobox">

                    </div>
                    <div class="you1">
                        <div class="jiage">￥299</div>
                        <div class="jiajian">
                            <div class="jian">-</div>
                            <div class="shu">1</div>
                            <div class="jia">+</div>
                        </div>
                        <div class="xiaoji red">￥299</div>

                    </div>
                </div>
                <div class="shangpin">
                    <div class="zuo">
                        <input type="checkbox" checked class="goxuan">
                        <div class="jieshaobox">

                                <div class="shangpinjianjie">87键 · 茶轴 · 白光</div>
                            </div>
                        </div>
                    </div>
                    <div class="you1">
                        <div class="jiage">￥199</div>
                        <div class="jiajian">
                            <div class="jian">-</div>
                            <div class="shu">2</div>
                            <div class="jia">+</div>
                        </div>
                        <div class="xiaoji red">￥398</div>
                        <div class="shanchu">删除</div>
                    </div>
                </div>
                <div class="shangpin">
                    <div class="zuo">
                        <input type="checkbox" checked class="goxuan">
                        <div class="jieshaobox">
                            <img src="img/shoubiao.svg" alt="" class="shangpintu">
                            <div class="shangpinxinxihezi">
                                <div class="shangpinmingcheng">智能手表</div>
                                <div class="shangpinjianjie">46mm · 心率监测 · 深空灰</div>
                            </div>
                        </div>
                    </div>
                    <div class="you1">
                        <div class="jiage">￥899</div>
                        <div class="jiajian">
                            <div class="jian">-</div>
                            <div class="shu">1</div>
                            <div class="jia">+</div>
                        </div>
                        <div class="xiaoji red">￥899</div>
                        <div class="shanchu">删除</div>
                    </div>
                </div>
                <div class="shangpin boderxia">
                    <div class="zuo">
                        <input type="checkbox" checked  class="goxuan">
                        <div class="jieshaobox">
                            <img src="img/taideng.svg" alt="" class="shangpintu">
                            <div class="shangpinxinxihezi">
                                <div class="shangpinmingcheng">护眼台灯</div>
                                <div class="shangpinjianjie">无频闪 · 三档色温 · 白色</div>

                        <div class="jiage">￥169</div>
                        <div class="jiajian">
                            <div class="jian">-</div>
                            <div class="shu">1</div>
                            <div class="jia">+</div>
                        </div>
                        <div class="xiaoji red">￥169</div>
                        <div class="shanchu">删除</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="dibu">
            <div class="zuo3">
                <input type="checkbox" checked class="zongkozhi">
                <div class="quanxuan">全选</div>
            </div>
            <div class="you3">
                <div class="quanjianbox">
                    <div class="yixuan">已选</div>
                    <div class="zong">5</div>
                    <div class="wujian">件</div>
                </div>
                <div class="hejibox">
                    <div class="heji">合计：</div>
                    <div class="zongjiner">￥1765</div>
                </div>
                <button class="jiesuan">结算</button>
